<body>
<header class="site-header">
  <a href="../" class="logo"><b>Nar</b><i>/</i><b>works</b></a>
  <nav class="nav" aria-label="Main">
    <a href="../work/">Work</a>

  </nav>

</header>

<main class="studio-stage">
  <div class="studio-video">
    <div id="player"></div>
    <button class="unmute" id="unmute" type="button" hidden>Tap for sound</button>
  </div>
</main>

<script>
(function () {
  var VIDEO_ID = 'g_vZasFzMN4';
  var player, btn = document.getElementById('unmute');

  btn.addEventListener('click', function () {
    if (!player) return;
    player.unMute();
    player.setVolume(100);
    player.playVideo();
    btn.hidden = true;
  });

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('player', {
      videoId: VIDEO_ID,
      host: 'https://www.youtube-nocookie.com',
      width: '100%',
      height: '100%',
      playerVars: { autoplay: 1, rel: 0, modestbranding: 1, playsinline: 1 },
      events: {
        onReady: function (e) {
          e.target.unMute();
          e.target.setVolume(100);
          e.target.playVideo();
          setTimeout(function () {
            if (player.getPlayerState() !== 1) {
              player.mute();
              player.playVideo();
            }
          }, 1200);
        },
        onStateChange: function (e) {
          if (e.data === 1 && player.isMuted()) btn.hidden = false;
          if (e.data === 1 && !player.isMuted()) btn.hidden = true;
        }
      }
    });
  };

  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
})();
</script>
</body>
</html>
